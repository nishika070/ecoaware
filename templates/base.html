<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}EcoAware Delhi{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}" />
    {% block page_head %}{% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <nav class="navbar">
      <div class="container navbar-inner">
        <a href="{{ url_for('home') }}" class="logo" aria-label="EcoAware Home">
          <span class="logo-badge">EA</span>
          EcoAware Delhi
        </a>

        <div class="nav-links">
          <a href="{{ url_for('home') }}" class="{% if active_page == 'home' %}active{% endif %}">Home</a>
          <a href="{{ url_for('aqi_page') }}" class="{% if active_page == 'aqi' %}active{% endif %}">AQI</a>
          <a href="{{ url_for('temperature_page') }}" class="{% if active_page == 'temperature' %}active{% endif %}">Temperature</a>
          <a href="{{ url_for('policies_page') }}" class="{% if active_page == 'policies' %}active{% endif %}">Policy Insights</a>
          <a href="{{ url_for('contact_page') }}" class="{% if active_page == 'contact' %}active{% endif %}">Contact</a>
        </div>
      </div>
    </nav>

    {% block content %}{% endblock %}

    <script src="{{ url_for('static', filename='app.js') }}"></script>
    {% block page_scripts %}{% endblock %}
  </body>
</html>
