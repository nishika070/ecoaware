<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}EcoAware Delhi{% endblock %}</title>

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}" />

    {% block page_head %}{% endblock %}

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>

  <body>
    <header class="site-header">
      <div class="container topbar">
        <a href="{{ url_for('home') }}" class="brand" aria-label="EcoAware Home">AQI</a>

        <nav class="top-links">
          <a href="{{ url_for('aqi_page') }}" class="{% if active_page == 'aqi' %}active{% endif %}">AQI</a>
          <a href="{{ url_for('policies_page') }}" class="{% if active_page == 'policies' %}active{% endif %}">Policy</a>
          <a href="{{ url_for('home') }}" class="{% if active_page == 'home' %}active{% endif %}">Insight</a>
          <a href="{{ url_for('contact_page') }}" class="{% if active_page == 'contact' %}active{% endif %}">Contact</a>
        </nav>

        <div class="search-wrap">
          <input type="text" placeholder="Search any location, city, state or country" aria-label="Search location" />
        </div>

        <div class="top-controls">
          <span>AQI-US</span>
          <span>C</span>
          <button type="button">Login</button>
        </div>
      </div>
    </header>

    <!-- ================= PAGE CONTENT ================= -->
    {% block content %}{% endblock %}

    <!-- ================= DATA FROM FLASK ================= -->
    <script id="station-coordinates-data" type="application/json">
      {{ station_coordinates | default({}, true) | tojson }}
    </script>

    <!-- ================= MAIN JS ================= -->
    <script src="{{ url_for('static', filename='app.js') }}"></script>

    <!-- ================= EXTRA PAGE JS ================= -->
    {% block page_scripts %}{% endblock %}
  </body>
</html>
